<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0E0A0A">
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="apple-touch-icon" href="assets/logo.png">
<title>Drawings — Stella Marine</title>
<style>
  /* ============================================================
     STELLA MARINE — DRAWINGS VIEWER v2 (shop floor, iPad-first)
     Brand palette per "Corporate Brand Guidelines 2025":
       Black Night #0E0A0A · Shadow Grey #282827
       Upsdell Red #AF1F24 · Burning Star Red #EA372E
       Titanium White #FFFFFF
     Type: Friz Quadrata Pro (headline) / Sweet Sans Pro (paragraph)
     ============================================================ */
  :root {
    --black-night: #0E0A0A;   /* page background            */
    --shadow-grey: #282827;   /* cards / surfaces           */
    --line:        #454542;   /* borders (derived neutral)  */
    --text-dim:    #b0b0ab;   /* secondary text (derived)   */
    --white:       #FFFFFF;   /* Titanium White — primary   */
    --red-bright:  #EA372E;   /* Burning Star Red — accent  */
    --red-deep:    #AF1F24;   /* Upsdell Red — fills        */
    --touch-min:   56px;      /* min tap target height      */
  }
  /* Brand webfonts are licensed (not on free CDNs). Drop the licensed
     files into a fonts/ folder next to this page and uncomment:
  @font-face { font-family:"Friz Quadrata Pro";
    src:url("fonts/FrizQuadrataPro.woff2") format("woff2"); font-display:swap; }
  @font-face { font-family:"Sweet Sans Pro"; font-weight:400;
    src:url("fonts/SweetSansPro-Light.woff2") format("woff2"); font-display:swap; }
  */
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body {
    font-family: "Sweet Sans Pro", "Sweet Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--black-night);
    color: var(--white);
    font-size: 17px;
    -webkit-font-smoothing: antialiased;
  }
  .brand-head {
    font-family: "Friz Quadrata Pro", "Friz Quadrata", "Friz Quadrata Std", Georgia, serif;
  }

  /* ---------- header : drawing title-block styling ---------- */
  header {
    border-bottom: 3px solid var(--red-bright);
    background: var(--shadow-grey);
    padding: 14px 20px 12px;
    display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
  }
  header .logo { height:34px; align-self:center; }
  header h1 {
    font-size: 21px; font-weight: 700;
    letter-spacing: .1em; text-transform: uppercase;
  }
  header .sub {
    font-size: 13px; color: var(--text-dim);
    letter-spacing:.05em;
  }
  header .count {
    margin-left:auto; font-size:13px; color:var(--text-dim);
    font-variant-numeric: tabular-nums;
  }

  /* ---------- login ---------- */
  #authView { display:none; max-width:380px; margin:0 auto; padding:70px 24px 0; }
  #authView.show { display:block; }
  #authView h2 { font-size:19px; margin-bottom:6px; letter-spacing:.06em; }
  #authView p  { color:var(--text-dim); font-size:15px; margin-bottom:26px; line-height:1.5; }
  .a-field { margin-bottom:16px; }
  .a-field label {
    display:block; font-size:12px; font-weight:700; letter-spacing:.14em;
    text-transform:uppercase; color:var(--text-dim); margin-bottom:7px;
  }
  .a-field input {
    width:100%; background:var(--shadow-grey);
    border:2px solid var(--line); border-radius:10px;
    color:var(--white); font-size:17px; font-family:inherit;
    padding:14px 16px; outline:none; min-height:var(--touch-min);
    transition:border-color .15s;
  }
  .a-field input:focus { border-color:var(--red-bright); }
  #loginBtn {
    width:100%; background:var(--red-deep); border:none; border-radius:10px;
    color:var(--white); font-size:17px; font-weight:700; font-family:inherit;
    letter-spacing:.04em; padding:15px; min-height:var(--touch-min);
    cursor:pointer; margin-top:8px;
  }
  #loginBtn:active { background:#8d181d; }
  #loginBtn:disabled { background:var(--line); color:var(--text-dim); }
  #loginErr { color:var(--red-bright); font-size:15px; margin-top:14px; min-height:22px; line-height:1.5; }

  /* ---------- app ---------- */
  #appView { display:none; }
  #appView.show { display:block; }

  /* ---------- search ---------- */
  .search-wrap {
    padding: 18px 20px 6px;
    position: sticky; top: 0; z-index: 10;
    background: linear-gradient(var(--black-night) 85%, transparent);
  }
  .search-box {
    display:flex; align-items:center;
    background: var(--shadow-grey);
    border: 2px solid var(--line);
    border-radius: 10px;
    transition: border-color .15s;
  }
  .search-box:focus-within { border-color: var(--red-bright); }
  .search-box svg { margin: 0 0 0 16px; flex-shrink:0; opacity:.6; }
  #searchInput {
    flex:1; background:none; border:none; outline:none;
    color: var(--white);
    font-size: 20px; font-family: inherit;
    padding: 16px 14px;
    min-height: var(--touch-min);
  }
  #searchInput::placeholder { color: var(--text-dim); }
  #clearBtn {
    display:none;
    background:none; border:none; color:var(--text-dim);
    font-size:26px; padding: 0 18px; min-height:var(--touch-min);
    cursor:pointer;
  }
  #clearBtn.show { display:block; }

  /* ---------- folder chips ---------- */
  .chips {
    display:flex; gap:10px; overflow-x:auto;
    padding: 12px 20px 4px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width:none;
  }
  .chips::-webkit-scrollbar { display:none; }
  .chip {
    flex-shrink:0;
    background: var(--shadow-grey);
    border: 1.5px solid var(--line);
    color: var(--white);
    border-radius: 999px;
    padding: 10px 20px;
    font-size: 15px; font-weight:600; font-family:inherit;
    letter-spacing:.03em;
    min-height: 44px;
    cursor:pointer;
    transition: all .12s;
  }
  .chip.active {
    background: var(--red-deep);
    border-color: var(--red-bright);
    color: var(--white);
  }
  .breadcrumb {
    display:none;
    padding: 10px 20px 0;
    font-size: 14px; color: var(--text-dim);
    letter-spacing:.04em;
  }
  .breadcrumb.show { display:block; }
  .breadcrumb button {
    background:none; border:none; color:var(--red-bright);
    font-size:14px; font-family:inherit; font-weight:600;
    cursor:pointer; padding: 6px 4px;
  }

  /* ---------- folder info strip (project metadata) ---------- */
  #folderInfo {
    display:none;
    margin: 12px 20px 0;
    background: var(--shadow-grey);
    border-left: 4px solid var(--red-bright);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 14px; line-height: 1.7;
  }
  #folderInfo.show { display:block; }
  #folderInfo .kv { margin-right:18px; display:inline-block; }
  #folderInfo .k { color: var(--text-dim); letter-spacing:.04em; }
  #folderInfo .v { color: var(--white); font-weight:600; }

  /* ---------- results list ---------- */
  #results { padding: 12px 20px 8px; }
  .row {
    display:flex; align-items:stretch; gap:0;
    background: var(--shadow-grey);
    border: 1.5px solid var(--line);
    border-radius: 12px;
    margin-bottom: 12px;
    min-height: 76px;
    overflow:hidden;
    transition: border-color .12s, transform .05s;
  }
  .row:active { transform: scale(.995); border-color: var(--red-bright); }
  .row-link {
    flex:1; min-width:0;
    display:flex; align-items:center; gap:16px;
    padding: 16px 8px 16px 18px;
    text-decoration:none; color:inherit;
    cursor:pointer;
  }

  /* signature element: revision stamp plate, like a title-block rev box */
  .rev-stamp {
    flex-shrink:0;
    width: 58px; height: 58px;
    border: 2.5px solid var(--red-bright);
    border-radius: 8px;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    background: rgba(234,55,46,.10);
  }
  .rev-stamp .rev-label {
    font-size: 9px; font-weight:700; letter-spacing:.18em;
    color: var(--red-bright); text-transform:uppercase;
  }
  .rev-stamp .rev-letter {
    font-family: "Friz Quadrata Pro", "Friz Quadrata", Georgia, serif;
    font-size: 25px; font-weight: 800;
    color: var(--white);
    line-height:1.1;
  }

  .row-main { flex:1; min-width:0; }
  .row-name {
    font-size: 19px; font-weight: 700;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .row-meta {
    display:flex; gap:14px; margin-top:5px;
    font-size: 14px; color: var(--text-dim);
    flex-wrap:wrap;
  }
  .row-meta .num { color: var(--white); font-weight:600; font-variant-numeric:tabular-nums; }
  .row-meta .path { letter-spacing:.02em; }
  .row-updated { font-size:13px; color:var(--text-dim); margin-top:3px; }

  /* flag button: separate tap zone on the right edge of each row */
  .flag-btn {
    flex-shrink:0; width:56px;
    display:flex; align-items:center; justify-content:center;
    background:none; border:none;
    border-left:1.5px solid var(--line);
    color:var(--text-dim);
    cursor:pointer;
  }
  .flag-btn:active { color:var(--red-bright); background:rgba(234,55,46,.08); }
  .flag-btn.flagged { color:var(--red-bright); }

  /* ---------- flag sheet ---------- */
  #sheetOverlay {
    display:none; position:fixed; inset:0; z-index:50;
    background:rgba(0,0,0,.6);
  }
  #sheetOverlay.show { display:block; }
  #flagSheet {
    position:fixed; left:0; right:0; bottom:-100%; z-index:51;
    background:var(--shadow-grey);
    border-top:3px solid var(--red-bright);
    border-radius:18px 18px 0 0;
    padding:22px 22px calc(26px + env(safe-area-inset-bottom));
    max-width:560px; margin:0 auto;
    transition:bottom .22s ease-out;
  }
  #flagSheet.show { bottom:0; }
  #flagSheet h3 { font-size:18px; margin-bottom:2px; }
  #flagSheet .fs-num { color:var(--text-dim); font-size:14px; margin-bottom:18px; }
  .reason-chips { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:14px; }
  .reason-chip {
    background:var(--black-night); border:1.5px solid var(--line); border-radius:999px;
    color:var(--white); font-size:15px; font-weight:600; font-family:inherit;
    padding:11px 18px; min-height:44px; cursor:pointer;
  }
  .reason-chip.sel { background:var(--red-deep); border-color:var(--red-bright); }
  #flagNote {
    width:100%; background:var(--black-night);
    border:1.5px solid var(--line); border-radius:10px;
    color:var(--white); font-size:16px; font-family:inherit;
    padding:12px 14px; outline:none; margin-bottom:16px;
  }
  #flagNote:focus { border-color:var(--red-bright); }
  .sheet-actions { display:flex; gap:12px; }
  .sheet-actions button {
    flex:1; border-radius:10px; font-size:16px; font-weight:700; font-family:inherit;
    padding:14px; min-height:var(--touch-min); cursor:pointer; letter-spacing:.03em;
  }
  #flagSend { background:var(--red-deep); border:none; color:var(--white); }
  #flagSend:disabled { background:var(--line); color:var(--text-dim); }
  #flagCancel { background:none; border:2px solid var(--line); color:var(--white); }
  #flagDone { display:none; text-align:center; padding:10px 0 4px; font-size:16px; line-height:1.6; }
  #flagDone strong { display:block; font-size:18px; margin-bottom:4px; }

  /* ---------- states ---------- */
  .state {
    text-align:center; padding: 70px 30px;
    color: var(--text-dim); font-size: 17px; line-height:1.6;
  }
  .state strong { color: var(--white); display:block; font-size:19px; margin-bottom:8px; }
  .spinner {
    width:36px; height:36px; margin: 0 auto 18px;
    border: 3px solid var(--line);
    border-top-color: var(--red-bright);
    border-radius:50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation-duration: 2s; }
    .row:active { transform:none; }
    #flagSheet { transition:none; }
  }

  #errorBanner, #updateBanner {
    display:none;
    background: #2b100e; border:1.5px solid var(--red-deep);
    color: var(--white);
    margin: 12px 20px 0; padding: 14px 18px;
    border-radius: 10px; font-size: 15px; line-height:1.5;
  }
  #errorBanner.show, #updateBanner.show { display:block; }
  #updateBanner button {
    background:var(--red-deep); border:none; border-radius:8px;
    color:var(--white); font-family:inherit; font-size:14px; font-weight:700;
    padding:9px 16px; margin-top:10px; cursor:pointer;
  }

  footer {
    padding: 8px 20px 40px;
    display:flex; align-items:center; gap:16px;
    color:var(--text-dim); font-size:12.5px;
  }
  footer .who { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  footer button {
    margin-left:auto; background:none; border:1.5px solid var(--line); border-radius:8px;
    color:var(--text-dim); font-family:inherit; font-size:12.5px;
    padding:8px 14px; cursor:pointer;
  }
</style>
</head>
<body>

<header>
  <img class="logo" src="assets/logo.svg" alt="Stella Marine">
  <h1 class="brand-head">Drawings</h1>
  <span class="sub">Stella Marine</span>
  <span class="count" id="countLabel"></span>
</header>

<!-- ============ LOGIN ============ -->
<div id="authView">
  <img src="assets/logo.svg" alt="" style="height:80px; display:block; margin:0 auto 24px;">
  <h2 class="brand-head">Sign in</h2>
  <p>This viewer is for Stella Marine staff. Use the account set up for this device.</p>
  <div class="a-field">
    <label for="loginEmail">Email</label>
    <input id="loginEmail" type="email" autocomplete="username" autocapitalize="off" spellcheck="false">
  </div>
  <div class="a-field">
    <label for="loginPass">Password</label>
    <input id="loginPass" type="password" autocomplete="current-password">
  </div>
  <button id="loginBtn">Sign in</button>
  <div id="loginErr"></div>
</div>

<!-- ============ APP ============ -->
<div id="appView">

  <div class="search-wrap">
    <div class="search-box">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#b0b0ab" stroke-width="2.5" stroke-linecap="round">
        <circle cx="10.5" cy="10.5" r="7"/><line x1="16" y1="16" x2="21" y2="21"/>
      </svg>
      <input id="searchInput" type="search" placeholder="Search drawing name or number…"
             autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <button id="clearBtn" aria-label="Clear search">×</button>
    </div>
  </div>

  <div class="chips" id="chipBar"></div>
  <div class="breadcrumb" id="crumb"></div>
  <div id="folderInfo"></div>

  <div id="updateBanner"></div>
  <div id="errorBanner"></div>

  <div id="results">
    <div class="state"><div class="spinner"></div>Loading drawings…</div>
  </div>

  <footer>
    <span id="verLabel"></span>
    <span class="who" id="whoLabel"></span>
    <button id="signOutBtn">Sign out</button>
  </footer>
</div>

<!-- ============ FLAG SHEET ============ -->
<div id="sheetOverlay"></div>
<div id="flagSheet" role="dialog" aria-modal="true">
  <div id="flagForm">
    <h3 id="fsName"></h3>
    <div class="fs-num" id="fsNum"></div>
    <div class="reason-chips" id="reasonChips"></div>
    <input id="flagNote" type="text" placeholder="Anything else? (optional)" autocomplete="off">
    <div class="sheet-actions">
      <button id="flagCancel">Cancel</button>
      <button id="flagSend">Send report</button>
    </div>
  </div>
  <div id="flagDone"></div>
</div>

<script type="module">
/* =====================================================================
   CONFIG — paste your Firebase project config here (same project as
   setup.html; SEPARATE project from Material Ordering).
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyDKtfyXxWzu8rOMiJP2qcvRObxnJEUQz5A",
  authDomain: "stella-workshop-drawings.firebaseapp.com",
  projectId: "stella-workshop-drawings",
  storageBucket: "stella-workshop-drawings.firebasestorage.app",
  messagingSenderId: "674286300074",
  appId: "1:674286300074:web:17c1fe44f2bb07178a99d3",
  measurementId: "G-83DPT2CHNX"
};

const APP_VERSION = "2.0";

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, getDocs, addDoc, query, where, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);          // default persistence = local; survives restarts
const db   = getFirestore(app);

/* ---------------- state ---------------- */
let allDrawings   = [];             // full metadata cache, loaded once
let foldersById   = new Map();      // folderId -> folder doc
let childrenOf    = new Map();      // parentId ("root" for null) -> sorted [folder]
let unresolvedFlagged = new Set();  // drawingIds with an open flag
let activeFolderId = null;          // null = All; "__unfiled__" = drawings w/o folderId
let searchTerm = "";
let flagTarget = null;              // drawing being reported
let selectedReason = null;
let lastVersionCheck = 0;

const $ = id => document.getElementById(id);
const $results = $("results"), $search = $("searchInput"), $clear = $("clearBtn");
const $chips = $("chipBar"), $crumb = $("crumb"), $count = $("countLabel");
const $error = $("errorBanner"), $info = $("folderInfo");

/* ---------------- auth ---------------- */
onAuthStateChanged(auth, user => {
  if (user) {
    $("authView").classList.remove("show");
    $("appView").classList.add("show");
    $("whoLabel").textContent = user.email || "";
    load();
  } else {
    $("appView").classList.remove("show");
    $("authView").classList.add("show");
    $("loginEmail").focus();
  }
});

async function doLogin() {
  const email = $("loginEmail").value.trim();
  const pass  = $("loginPass").value;
  const err   = $("loginErr");
  err.textContent = "";
  if (!email || !pass) { err.textContent = "Enter the email and password."; return; }
  $("loginBtn").disabled = true;
  try {
    await signInWithEmailAndPassword(auth, email, pass);
    $("loginPass").value = "";
  } catch (e) {
    err.textContent =
      (e.code === "auth/network-request-failed")
        ? "No connection. Check the wifi and try again."
        : "Wrong email or password.";
  }
  $("loginBtn").disabled = false;
}
$("loginBtn").addEventListener("click", doLogin);
$("loginPass").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
$("signOutBtn").addEventListener("click", async () => {
  if (confirm("Sign out? Someone will need the password to use this iPad again.")) {
    await signOut(auth);
  }
});

/* ---------------- load ---------------- */
async function load() {
  try {
    const [dSnap, fSnap, flSnap] = await Promise.all([
      getDocs(collection(db, "drawings")),
      getDocs(collection(db, "folders")),
      getDocs(query(collection(db, "flags"), where("resolved", "==", false))),
    ]);
    allDrawings = dSnap.docs.map(d => ({ id: d.id, ...d.data() }))
      .filter(d => d.currentLink && !d.hidden);
    allDrawings.sort((a,b) => (a.drawingName||"").localeCompare(b.drawingName||""));

    foldersById = new Map(fSnap.docs.map(f => [f.id, { id: f.id, ...f.data() }]));
    childrenOf = new Map();
    for (const f of foldersById.values()) {
      const key = f.parentId || "root";
      if (!childrenOf.has(key)) childrenOf.set(key, []);
      childrenOf.get(key).push(f);
    }
    for (const list of childrenOf.values())
      list.sort((a,b) => (a.order ?? 0) - (b.order ?? 0) || (a.name||"").localeCompare(b.name||""));

    unresolvedFlagged = new Set(flSnap.docs.map(f => f.data().drawingId));

    $count.textContent = allDrawings.length + " drawings";
    $error.classList.remove("show");
    buildChips();
    render();
  } catch (err) {
    $error.textContent = "Couldn't load the drawing list. Check the wifi connection, then close and reopen the app. If it keeps failing, tell engineering.";
    $error.classList.add("show");
    $results.innerHTML = "";
    console.error(err);
  }
  checkVersion();
}

/* ---------------- folder helpers ---------------- */
function folderPathText(d) {
  if (d.folderId && foldersById.has(d.folderId)) {
    const parts = [];
    let f = foldersById.get(d.folderId);
    let hops = 0;
    while (f && hops++ < 20) { parts.unshift(f.name || "?"); f = f.parentId ? foldersById.get(f.parentId) : null; }
    return parts.join(" / ");
  }
  return d.folderPath || "";      // pre-migration fallback
}
function descendantSet(folderId) {
  const s = new Set([folderId]);
  const walk = id => { for (const c of (childrenOf.get(id) || [])) { s.add(c.id); walk(c.id); } };
  walk(folderId);
  return s;
}
function hasUnfiled() {
  return allDrawings.some(d => !d.folderId || !foldersById.has(d.folderId));
}

/* ---------------- folder chips ---------------- */
function buildChips() {
  $chips.innerHTML = "";

  const mkChip = (label, active, onTap) => {
    const c = document.createElement("button");
    c.className = "chip" + (active ? " active" : "");
    c.textContent = label;
    c.onclick = onTap;
    $chips.appendChild(c);
  };

  mkChip("All", activeFolderId === null, () => { activeFolderId = null; buildChips(); render(); });

  const kids = activeFolderId && activeFolderId !== "__unfiled__"
    ? (childrenOf.get(activeFolderId) || [])
    : (childrenOf.get("root") || []);
  for (const f of kids)
    mkChip(f.name || "?", activeFolderId === f.id, () => { activeFolderId = f.id; buildChips(); render(); });

  if (activeFolderId === null && foldersById.size > 0 && hasUnfiled())
    mkChip("Unfiled", false, () => { activeFolderId = "__unfiled__"; buildChips(); render(); });

  // breadcrumb + folder info strip
  $info.classList.remove("show");
  if (activeFolderId && activeFolderId !== "__unfiled__" && foldersById.has(activeFolderId)) {
    const parts = [];
    let f = foldersById.get(activeFolderId), hops = 0;
    while (f && hops++ < 20) { parts.unshift(f); f = f.parentId ? foldersById.get(f.parentId) : null; }
    $crumb.classList.add("show");
    $crumb.innerHTML = "";
    const back = document.createElement("button");
    back.textContent = "‹ Back";
    back.onclick = () => {
      const cur = foldersById.get(activeFolderId);
      activeFolderId = cur && cur.parentId ? cur.parentId : null;
      buildChips(); render();
    };
    $crumb.appendChild(back);
    $crumb.appendChild(document.createTextNode("  " + parts.map(p => p.name).join("  /  ")));

    const meta = foldersById.get(activeFolderId).meta || {};
    const entries = Object.entries(meta).filter(([,v]) => v !== "" && v != null);
    if (entries.length) {
      $info.innerHTML = entries.map(([k,v]) =>
        `<span class="kv"><span class="k">${escapeHtml(k)}:</span> <span class="v">${escapeHtml(String(v))}</span></span>`
      ).join("");
      $info.classList.add("show");
    }
  } else if (activeFolderId === "__unfiled__") {
    $crumb.classList.add("show");
    $crumb.innerHTML = "";
    const back = document.createElement("button");
    back.textContent = "‹ Back";
    back.onclick = () => { activeFolderId = null; buildChips(); render(); };
    $crumb.appendChild(back);
    $crumb.appendChild(document.createTextNode("  Unfiled"));
  } else {
    $crumb.classList.remove("show");
  }
}

/* ---------------- search + filter ---------------- */
function norm(s) { return (s || "").toLowerCase().replace(/[-_\s]+/g, " ").trim(); }

function matches(d, term) {
  if (!term) return true;
  const name = norm(d.drawingName), num = norm(d.drawingNumber);
  const words = term.split(" ");
  return words.every(w => name.includes(w) || num.includes(w));
}
function score(d, term) {
  if (!term) return 0;
  const num = norm(d.drawingNumber);
  let s = 0;
  for (const w of term.split(" ")) {
    if (num.includes(w)) s += 2;          // drawing-number match outranks name match
    if (num.startsWith(w)) s += 2;
  }
  return -s; // ascending sort
}

function filtered() {
  const term = norm(searchTerm);
  let list = allDrawings;
  if (activeFolderId === "__unfiled__") {
    list = list.filter(d => !d.folderId || !foldersById.has(d.folderId));
  } else if (activeFolderId) {
    const set = descendantSet(activeFolderId);
    list = list.filter(d => d.folderId && set.has(d.folderId));
  }
  list = list.filter(d => matches(d, term));
  if (term) list = [...list].sort((a,b) => score(a,term) - score(b,term));
  return list;
}

/* ---------------- render ---------------- */
function fmtDate(ts) {
  if (!ts) return "";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString("en-AU", { day:"numeric", month:"short", year:"numeric" });
}

function render() {
  const list = filtered();
  if (!allDrawings.length) {
    $results.innerHTML = `<div class="state"><strong>No drawings yet</strong>Engineering hasn't added any drawings. Once they do, they'll appear here.</div>`;
    return;
  }
  if (!list.length) {
    $results.innerHTML = `<div class="state"><strong>Nothing found</strong>Check the spelling, or try part of the drawing number.</div>`;
    return;
  }
  $results.innerHTML = "";
  for (const d of list) {
    const row = document.createElement("div");
    row.className = "row";
    const flagged = unresolvedFlagged.has(d.id);
    row.innerHTML = `
      <a class="row-link" href="${escapeHtml(d.currentLink)}" target="_blank" rel="noopener">
        <div class="rev-stamp">
          <span class="rev-label">Rev</span>
          <span class="rev-letter">${escapeHtml(d.currentRevision || "–")}</span>
        </div>
        <div class="row-main">
          <div class="row-name">${escapeHtml(d.drawingName || "(unnamed)")}</div>
          <div class="row-meta">
            ${d.drawingNumber ? `<span class="num">${escapeHtml(d.drawingNumber)}</span>` : ""}
            <span class="path">${escapeHtml(folderPathText(d))}</span>
          </div>
          ${d.currentUpdatedAt ? `<div class="row-updated">Updated ${fmtDate(d.currentUpdatedAt)}</div>` : ""}
        </div>
      </a>
      <button class="flag-btn${flagged ? " flagged" : ""}" aria-label="Report a problem with this drawing" title="Report a problem">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="${flagged ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 21V4c2.5-1.6 5-1.6 8 0s5.5 1.6 8 0v11c-2.5 1.6-5 1.6-8 0s-5.5-1.6-8 0"/>
        </svg>
      </button>`;
    row.querySelector(".flag-btn").onclick = () => openFlagSheet(d);
    $results.appendChild(row);
  }
}

/* ---------------- flag sheet ---------------- */
const REASONS = ["Won't open", "Wrong drawing", "Out of date"];

function openFlagSheet(d) {
  flagTarget = d;
  selectedReason = null;
  $("fsName").textContent = d.drawingName || "(unnamed)";
  $("fsNum").textContent  = d.drawingNumber || "";
  $("flagNote").value = "";
  $("flagDone").style.display = "none";

  if (unresolvedFlagged.has(d.id)) {
    $("flagForm").style.display = "none";
    $("flagDone").style.display = "block";
    $("flagDone").innerHTML = `<strong>Already reported</strong>Engineering can see this one. Tap anywhere to close.`;
  } else {
    $("flagForm").style.display = "block";
    const rc = $("reasonChips");
    rc.innerHTML = "";
    for (const r of REASONS) {
      const b = document.createElement("button");
      b.className = "reason-chip";
      b.textContent = r;
      b.onclick = () => {
        selectedReason = selectedReason === r ? null : r;
        [...rc.children].forEach(x => x.classList.toggle("sel", x.textContent === selectedReason));
      };
      rc.appendChild(b);
    }
  }
  $("sheetOverlay").classList.add("show");
  $("flagSheet").classList.add("show");
}
function closeFlagSheet() {
  $("sheetOverlay").classList.remove("show");
  $("flagSheet").classList.remove("show");
  flagTarget = null;
}
$("sheetOverlay").addEventListener("click", closeFlagSheet);
$("flagCancel").addEventListener("click", closeFlagSheet);
$("flagDone").addEventListener("click", closeFlagSheet);

$("flagSend").addEventListener("click", async () => {
  if (!flagTarget) return;
  const note = $("flagNote").value.trim();
  const reason = [selectedReason, note].filter(Boolean).join(" — ");
  const btn = $("flagSend");
  btn.disabled = true;
  try {
    await addDoc(collection(db, "flags"), {
      drawingId:     flagTarget.id,
      drawingName:   flagTarget.drawingName || "",
      drawingNumber: flagTarget.drawingNumber || "",
      reason:        reason,
      flaggedAt:     serverTimestamp(),
      resolved:      false,
    });
    unresolvedFlagged.add(flagTarget.id);
    $("flagForm").style.display = "none";
    $("flagDone").style.display = "block";
    $("flagDone").innerHTML = `<strong>Reported</strong>Engineering will sort it out. Tap anywhere to close.`;
    render();
  } catch (err) {
    $("flagDone").style.display = "block";
    $("flagDone").innerHTML = `<strong>Couldn't send</strong>Check the wifi and try again.`;
    console.error(err);
  }
  btn.disabled = false;
});

/* ---------------- version / staleness ---------------- */
$("verLabel").textContent = "v" + APP_VERSION;
async function checkVersion() {
  const now = Date.now();
  if (now - lastVersionCheck < 60 * 60 * 1000) return;   // at most hourly
  lastVersionCheck = now;
  try {
    const res  = await fetch(location.pathname + "?ts=" + now, { cache: "no-store" });
    const text = await res.text();
    const m = text.match(/APP_VERSION\s*=\s*"([^"]+)"/);
    if (m && m[1] !== APP_VERSION) {
      const b = $("updateBanner");
      b.innerHTML = `A newer version of this app is available (v${escapeHtml(m[1])}).<br>
        <button id="reloadBtn">Update now</button>`;
      b.classList.add("show");
      $("reloadBtn").onclick = () => location.reload();
    }
  } catch { /* offline — ignore */ }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && auth.currentUser) checkVersion();
});

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

/* ---------------- events ---------------- */
$search.addEventListener("input", () => {
  searchTerm = $search.value;
  $clear.classList.toggle("show", !!searchTerm);
  render();
});
$clear.addEventListener("click", () => {
  $search.value = ""; searchTerm = "";
  $clear.classList.remove("show");
  $search.focus();
  render();
});
</script>
